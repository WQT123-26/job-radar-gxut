# 推送与提醒配置 v3：每天三次（早/中/晚），每批从待推池取 batch_size 条
push:
  # 每次推送的岗位数量（三批互不重复，池内顺延）
  batch_size: 12
  # 同一公司/同一城市在本批内的数量上限，避免一批里全是同一家
  max_same_company: 2
  max_same_city: 5
  # 待推池容量上限（超出按分数截断）
  pool_cap: 600

# 三个时段（北京时间），用于日志与邮件标题标识
slots:
  morning: "07:30"
  noon: "12:30"
  evening: "18:30"

notify:
  email:
    enabled: true
    provider: qq_smtp
    smtp_host: smtp.qq.com
    smtp_port: 465
    use_ssl: true
    from_user_env: QQ_MAIL_USER        # GitHub Secret
    auth_code_env: QQ_MAIL_AUTH_CODE   # GitHub Secret（QQ邮箱授权码）
    to_env: MAIL_TO                    # 主收件人
    cc_env: MAIL_CC                    # 抄送
    subject_prefix: "[求职雷达]"
  reminder:
    deadline_alert:
      enabled: true
      hour_local: 18    # 每天18点推送即将截止的岗位提醒
      window_days: 3    # 截止前3天内视为“即将截止”
  weekly_report:
    enabled: true
    weekday_local: 1    # 周一
    hour_local: 9       # 09:00
  report:
    daily_max_items: 20
    sort_by: [score, deadline]
    include_pages_link: true

quota:              # 兼容旧字段（新流程以 push.batch_size 为准）
  S: 6
  A: 8
  B: 4
  C: 2
