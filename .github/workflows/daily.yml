name: Job Push (3x daily)

on:
  schedule:
    # 北京时间 07:30 / 12:30 / 18:30（UTC = 北京 - 8h）
    - cron: '30 23 * * *'
    - cron: '30 4 * * *'
    - cron: '30 10 * * *'
  workflow_dispatch: {}

concurrency:
  group: job-push
  cancel-in-progress: false

permissions:
  contents: write
  issues: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run push batch
        env:
          QQ_MAIL_USER: ${{ secrets.QQ_MAIL_USER }}
          QQ_MAIL_AUTH_CODE: ${{ secrets.QQ_MAIL_AUTH_CODE }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_CC: ${{ secrets.MAIL_CC }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.run_daily
      - name: Commit queue state + pages
        run: |
          git config user.name "job-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/ || true
          # 待推池与已推指纹必须入库（被 .gitignore 忽略，需 -f），
          # 这是早/中/晚三批互不重复的关键状态
          git add -f state/queue.json state/seen_keys.txt || true
          git diff --cached --quiet || git commit -m "chore: update queue/data [skip ci]"
          git pull --rebase --autostash || true
          git push
